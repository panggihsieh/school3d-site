<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校園 3D 與四向實景導覽</title><link rel="stylesheet" href="./photos.css"><style>body{background:#e9edde}header{padding:14px 20px}header h1{font-size:23px}.tour-tools{padding:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tour-tools label{margin:0;min-width:180px}.tour-tools select{margin:0}#viewer{width:100%;height:65dvh;min-height:320px;display:block;touch-action:none}#tour-status,#tour-note{padding:0 18px}#photo-strip{display:flex;gap:12px;overflow:auto;padding:16px}#photo-strip a{flex:0 0 170px}#photo-strip img{width:170px;height:110px;object-fit:cover}#xr-note{font-size:13px;padding:0 18px}.simple-frame{height:55dvh;min-height:280px;background:#173f32;display:grid;place-items:center;overflow:hidden;touch-action:pan-y;border-radius:14px;padding:10px}.simple-frame img{width:100%;height:100%;object-fit:contain;min-height:0;user-select:none;pointer-events:none}.simple-frame p{color:white;max-width:420px;text-align:center}.simple-directions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.simple-directions [aria-pressed=true]{background:#b36b13}#simple-view{margin:0 14px}#simple-view button{margin-bottom:8px}</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body><header><a href="./">← 校園首頁</a><h1>3D／實景校園導覽</h1><p>3D 校園搭配四向實拍照片導覽；一般手機即可拍攝，不必拍天空。</p></header><div class="tour-tools"><label>瀏覽內容<select id="scene-mode"><option value="model">3D 校園示意模型</option><option value="simple">簡易 VR・四向實景（不看天空）</option><option value="panorama">360° 實景環景</option></select></label><label id="station-wrap" hidden>環景站點<select id="station"></select></label><button id="previous" hidden>上一站</button><button id="next" hidden>下一站</button><a id="capture-space" class="button" href="./field.html?mode=space">定位拍攝簡易 VR（管理員）</a><button id="reset">重設視角</button><button id="fullscreen">全螢幕</button><button id="vr" disabled>檢查 VR 支援中…</button></div><p id="tour-status" role="status">載入導覽中…</p><section id="simple-view" hidden></section><canvas id="viewer" aria-label="可拖曳旋轉及縮放的校園導覽"></canvas><p id="tour-note">拖曳旋轉，雙指縮放。環景站點的順序是編號順序，不代表可直接穿越的步行路線。</p><p id="xr-note">iPhone 可用觸控環視；沉浸式 VR 需瀏覽器與頭戴裝置支援 WebXR。VR 中請保持在安全活動範圍。</p><div id="photo-strip" aria-label="已發布校園實拍照片"></div><script type="module" src="./tour.js?v=simple-vr-1"></script></body></html>
