<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校園補拍地圖｜P01–P18</title><link rel="stylesheet" href="./capture.css"><link rel="stylesheet" href="./map-orientation.css?v=entry-restore-20261106"></head><body>
<header><a href="./">← 校園導覽</a> · <a href="./field.html">樹木定位・語音拍照 →</a><h1>校園補拍地圖</h1><p>依 P01 → P18 順序補拍；點地圖標號查看拍攝內容。</p></header>
<main><section class="controls"><label>拍攝設備 <select id="mode"><option value="phone">一般手機：每站 4 張（簡易 VR）</option><option value="sphere">360 相機：每站 1 張</option></select></label><strong id="total"></strong><button id="print">列印／存成 PDF</button><a href="./field.html?mode=space">空間拍照後台 →</a></section>
<p class="notice">位置為俯視圖片上的建議站點，非 GPS 或測量座標。樓梯口、入口與特色植物區需現場確認；請在可通行處拍攝。一般手機的 4 張照片可做左右切換導覽，不必拍天空；不等於完整 360° 環景。</p>
<div class="layout"><section><div class="map-scroll" tabindex="0" aria-label="補拍俯視圖，小螢幕可左右滑動"><div id="capture-map"><img src="./assets/campus-overview.png" alt="大南國小校園俯視圖，北朝左下方，拍攝站點以 P01 至 P18 標示"><svg id="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div id="pins"></div></div></div><p class="hint">手機橫放看全圖；直放時可左右滑動地圖。標籤格式「站號 × 建議張數」，綠色表示你已勾選拍妥。</p><article id="selected" aria-live="polite"></article></section><aside><h2>補拍清單</h2><p id="progress" role="status"></p><p class="hint">勾選紀錄僅存目前瀏覽器，手機與電腦不會同步；切換設備分開計算。</p><div id="checklist"></div></aside></div></main><script type="module" src="./capture.js?v=entry-restore-20261106"></script><!-- project-version:start --><footer id="project-version" aria-label="網站版本資訊" style="display:block;clear:both;margin:16px 12px;padding:10px 14px;border:1px solid #dce1d4;border-radius:6px;background:#fffdf7;color:#24483c;font:12px/1.8 system-ui,sans-serif;overflow-wrap:anywhere">版本：v0.3.86 ｜ 最後修改：2026/11/09 13:21（臺灣時間）</footer><!-- project-version:end -->
