<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safari 系統語音獨立測試</title><style>body{font:17px/1.7 system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 18px;color:#24483c;background:#f6f5ed}button,select{font:inherit;padding:12px;max-width:100%;margin:6px 0}label{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border:1px solid #dce1d4}button:focus-visible,select:focus-visible{outline:3px solid #b9773d}</style></head><body><main><h1>系統語音獨立測試</h1><p>此頁不啟動麥克風、定位、AI 或音檔播放器。請先選「瀏覽器預設」，按「播放測試」，再分別測試美佳、婷婷。</p><label>聲音<select id="voice"><option value="">瀏覽器預設（不指定語言或聲音）</option></select></label><button id="play">播放測試</button> <button id="stop">停止並重設佇列</button> <button id="refresh">更新聲音清單</button><p id="status" role="status">尚未測試。</p><p>「收到 start」僅表示瀏覽器回報啟動，不代表喇叭確實有聲。請回報是否聽到，以及下面的事件紀錄。</p><pre id="log" aria-label="語音事件紀錄"></pre><a href="./field.html">返回現場採集</a></main><script type="module" src="./speech-diagnostic.js?v=20261106-1"></script><!-- project-version:start --><footer id="project-version" aria-label="網站版本資訊" style="display:block;clear:both;margin:16px 12px;padding:10px 14px;border:1px solid #dce1d4;border-radius:6px;background:#fffdf7;color:#24483c;font:12px/1.8 system-ui,sans-serif;overflow-wrap:anywhere">版本：v0.3.91 ｜ 最後修改：2026/11/11 14:45（臺灣時間）</footer><!-- project-version:end -->
</body></html>
